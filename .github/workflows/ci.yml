name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace boundaries (loose coupling)
        run: pnpm check:boundaries
      - name: OpenAPI is up to date with contracts
        run: pnpm openapi && git diff --exit-code packages/contracts/openapi.json
      - name: DB migrations are up to date with schema
        timeout-minutes: 3
        run: |
          pnpm --filter @gsc/db generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/src/schema.ts changed without a migration. Run 'pnpm --filter @gsc/db generate' and commit it."
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
