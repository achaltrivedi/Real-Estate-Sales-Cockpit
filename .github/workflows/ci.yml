name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace boundaries (loose coupling)
        run: pnpm check:boundaries
      - name: OpenAPI is up to date with contracts
        run: pnpm openapi && git diff --exit-code packages/contracts/openapi.json
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
